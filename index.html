<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sakura Verse - Poetry in Bloom</title>
    <style>
        :root {
            --sakura-pink: #f8d7e6;
            --blossom-pink: #ffb3c8;
            --petal-white: #fff5f9;
            --branch-brown: #6b4f40;
            --leaf-green: #8ca87c;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Quicksand', sans-serif;
        }

        body {
            background: linear-gradient(135deg, var(--petal-white) 0%, var(--sakura-pink) 100%);
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
            color: var(--branch-brown);
        }

        /* Sakura Petal Animation */
        .petals {
            position: fixed;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1; /* Below content */
        }

        .petal {
            position: absolute;
            font-size: 1.5rem;
            color: #ffb3c8;
            opacity: 0.8;
            animation: fall linear infinite;
            text-shadow: 0 0 8px rgba(255, 179, 200, 0.3);
        }

        @keyframes fall {
            0% { 
                transform: translateY(-10vh) rotate(0deg);
                opacity: 0.8;
            }
            100% { 
                transform: translateY(110vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* Blossom Menu Button */
        .menu-btn {
            position: fixed;
            top: 1rem;
            right: 1rem;
            width: 50px;
            height: 50px;
            background: var(--blossom-pink);
            border-radius: 50%;
            cursor: pointer;
            z-index: 1000;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(255, 179, 200, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .menu-btn:hover {
            transform: scale(1.1);
            background: #ff9eb8;
            box-shadow: 0 6px 25px rgba(255, 158, 184, 0.4);
        }

        .menu-btn::before {
            content: '🌸';
            font-size: 1.5rem;
        }

        /* Menu Content */
        .menu-content {
            position: fixed;
            top: 0;
            right: -100%;
            background: rgba(255, 255, 255, 0.95);
            width: 100%;
            max-width: 280px;
            height: 100vh;
            padding: 4rem 1.5rem 1.5rem;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 999;
            backdrop-filter: blur(5px);
            overflow-y: auto;
        }

        .menu-content.active {
            right: 0;
        }

        .menu-content a {
            display: block;
            color: var(--branch-brown);
            text-decoration: none;
            padding: 1rem;
            margin: 0.5rem 0;
            border-radius: 8px;
            transition: all 0.3s ease;
            position: relative;
        }

        .menu-content a::before {
            content: '';
            position: absolute;
            left: 0;
            bottom: 0;
            width: 0;
            height: 2px;
            background: var(--blossom-pink);
            transition: width 0.3s ease;
        }

        .menu-content a:hover, .menu-content a:active {
            background: rgba(255, 179, 200, 0.1);
            padding-left: 1.5rem;
        }

        .menu-content a:hover::before, .menu-content a:active::before {
            width: 100%;
        }

        /* Close button for mobile menu */
        .close-menu {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--branch-brown);
            display: none;
        }

        /* Header Styles */
        header {
            text-align: center;
            padding: 6rem 1rem 3rem;
            position: relative;
            z-index: 2; /* Above petals */
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3rem;
            color: var(--branch-brown);
            text-shadow: 2px 2px 4px rgba(107, 79, 64, 0.1);
            margin-bottom: 1rem;
        }

        .tagline {
            font-size: 1.1rem;
            color: var(--leaf-green);
            letter-spacing: 1px;
            padding: 0 1rem;
        }

        /* Poem Cards */
        .poem-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
            padding: 1.5rem;
            max-width: 1200px;
            margin: 0 auto;
            position: relative;
            z-index: 2; /* Above petals */
        }

        .poem-card {
            background: rgba(255, 255, 255, 0.9);
            padding: 1.5rem;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
            transition: transform 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .poem-card:hover {
            transform: translateY(-5px);
        }

        /* Responsive Design */
        @media (min-width: 768px) {
            .menu-btn {
                top: 2rem;
                right: 2rem;
                width: 70px;
                height: 70px;
            }
            
            .menu-btn::before {
                font-size: 2.5rem;
            }

            .menu-content {
                top: 10rem;
                right: -300px;
                height: auto;
                border-radius: 15px;
                padding: 1.5rem;
                max-width: 280px;
            }

            .menu-content.active {
                right: 2rem;
            }

            .close-menu {
                display: none;
            }

            header {
                padding: 8rem 0 4rem;
            }

            h1 {
                font-size: 4rem;
            }

            .tagline {
                font-size: 1.2rem;
            }

            .poem-grid {
                padding: 2rem;
                gap: 2rem;
            }

            .poem-card {
                padding: 2rem;
            }
        }

        /* Touch-friendly targets for mobile */
        @media (max-width: 767px) {
            .menu-content a {
                padding: 1.2rem 1rem;
                margin: 0.7rem 0;
            }

            .close-menu {
                display: block;
            }
            
            .poem-card {
                margin-bottom: 1rem;
            }
        }
    </style>
</head>
<body>
    <!-- Sakura Blossoms -->
    <div class="petals" id="petals"></div>

    <div class="container">
        <!-- Blossom Menu -->
        <div class="menu-btn" onclick="toggleMenu()"></div>
        <nav class="menu-content" id="menuContent">
            <button class="close-menu" onclick="toggleMenu()">✕</button>
            <a href="/haiku">Haiku Garden</a>
            <a href="/sonnets">Blossom Sonnets</a>
            <a href="/modern">Spring Verse</a>
            <a href="/forms">Floral Forms</a>
            <a href="/history">Sakura History</a>
            <a href="/poets">Seasonal Poets</a>
            <a href="/symbolism">Flower Meanings</a>
        </nav>

        <header>
            <h1>Sakura Verse</h1>
            <p class="tagline">Where Poetry Blooms Like Cherry Flowers</p>
        </header>

        <main>
            <div class="poem-grid">
                <div class="poem-card">
                    <h2>Spring Awakening</h2>
                    <p>"A World of Blossoms" by Matsuo Bashō</p>
                </div>
                <div class="poem-card">
                    <h2>Floral Form</h2>
                    <p>The Art of Tanka Poetry</p>
                </div>
                <div class="poem-card">
                    <h2>Poet's Grove</h2>
                    <p>Yosa Buson: Master of Nature</p>
                </div>
            </div>
        </main>
    </div>

    <script>
        function toggleMenu() {
            const menu = document.getElementById('menuContent');
            menu.classList.toggle('active');
        }

        // Create falling sakura blossoms
        function createPetals() {
            const petalsContainer = document.getElementById('petals');
            const blossom = '🌸';
            
            // Reduce number of petals on smaller screens
            const isMobile = window.innerWidth <= 768;
            const petalCount = isMobile ? 10 : 20;
            
            for (let i = 0; i < petalCount; i++) {
                const petal = document.createElement('div');
                petal.className = 'petal';
                petal.innerHTML = blossom;
                petal.style.left = Math.random() * 100 + 'vw';
                petal.style.animationDuration = (Math.random() * 8 + 6) + 's';
                petal.style.animationDelay = Math.random() * 5 + 's';
                petal.style.fontSize = (Math.random() * (isMobile ? 15 : 20) + (isMobile ? 10 : 15)) + 'px';
                petalsContainer.appendChild(petal);
            }
        }
        
        // Initialize petals
        createPetals();
        
        // Handle window resize
        window.addEventListener('resize', function() {
            // Clear existing petals
            const petalsContainer = document.getElementById('petals');
            petalsContainer.innerHTML = '';
            
            // Create new petals appropriate for screen size
            createPetals();
        });
        
        // Close menu when clicking outside
        document.addEventListener('click', function(event) {
            const menu = document.getElementById('menuContent');
            const menuBtn = document.querySelector('.menu-btn');
            
            if (menu.classList.contains('active') && 
                !menu.contains(event.target) && 
                event.target !== menuBtn) {
                menu.classList.remove('active');
            }
        });
    </script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
</body>
</html>
